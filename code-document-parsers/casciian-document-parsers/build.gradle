/*
 * Casciian Document Parsers add-on
 *
 * Optional add-on that provides DocumentParser implementations converting
 * documents into the Casciian RichText model. The first parser is Markdown,
 * built on commonmark-java (with the GFM tables, strikethrough and task list
 * extensions). Publishable to Maven Central so applications can opt-in.
 */
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // The add-on's public API depends on casciian types (e.g. DocumentParser,
    // RichText), so casciian is exposed as an `api` dependency. This makes
    // it available to downstream consumers' compile/module path and is
    // recorded with `compile` scope in the published POM.
    api "io.github.crramirez:casciian:${project.casciianVersion}"

    // Markdown parsing (CommonMark + GitHub Flavored Markdown extensions).
    implementation "org.commonmark:commonmark:${project.commonmarkVersion}"
    implementation "org.commonmark:commonmark-ext-gfm-tables:${project.commonmarkVersion}"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:${project.commonmarkVersion}"
    implementation "org.commonmark:commonmark-ext-task-list-items:${project.commonmarkVersion}"

    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.21.0'
}

tasks.jar {
    manifest {
        attributes(
                'Implementation-Title': 'casciian-document-parsers',
                'Implementation-Version': project.version
        )
    }
}

tasks.javadoc {
    options.memberLevel = JavadocMemberLevel.PROTECTED
    options.author = true
    options.version = true
    options.links('https://docs.oracle.com/en/java/javase/21/docs/api/')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'casciian-document-parsers'

            pom {
                name = 'casciian-document-parsers'
                description = 'Casciian Document Parsers add-on - pluggable ' +
                        'document parsers (Markdown, and more) producing Casciian RichText.'
                url = 'https://github.com/crramirez/casciian'

                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'crramirez'
                        name = 'crramirez'
                        url = 'https://github.com/crramirez'
                    }
                }
                scm {
                    url = 'https://github.com/crramirez/casciian'
                    connection = 'scm:git:https://github.com/crramirez/casciian.git'
                    developerConnection = 'scm:git:ssh://git@github.com/crramirez/casciian.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = "localStaging"
            url = rootProject.layout.buildDirectory.dir("staging-repo")
        }
    }
}

def signingKeyId = (findProperty("signingKeyId") ?: System.getenv("SIGNING_KEY_ID"))?.toString()
def signingKeyB64 = (findProperty("signingKeyB64") ?: System.getenv("SIGNING_KEY_B64"))?.toString()
def signingPassword = (findProperty("signingPassword") ?: System.getenv("SIGNING_PASSWORD"))?.toString()

def signingKey = null
if (signingKeyB64) {
    signingKey = new String(Base64.decoder.decode(signingKeyB64), "UTF-8")
}

signing {
    if (signingKeyId && signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
        sign publishing.publications
    }
}

tasks.register('publishToLocalStaging') {
    group = 'publishing'
    description = 'Publishes signed artifacts to build/staging-repo (for Central Portal bundling).'
    dependsOn(
        'publishMavenJavaPublicationToLocalStagingRepository'
    )
}

tasks.register('centralBundleZip', Zip) {
    group = 'publishing'
    description = 'Creates a Maven-layout ZIP bundle for Sonatype Central Portal upload.'
    dependsOn('publishToLocalStaging')

    from(rootProject.layout.buildDirectory.dir("staging-repo"))
    archiveBaseName.set("casciian-document-parsers-central")
    archiveVersion.set(project.version.toString())
    destinationDirectory.set(rootProject.layout.buildDirectory.dir("central-bundle"))

    // Result: build/central-bundle/casciian-document-parsers-central-<version>.zip
}
